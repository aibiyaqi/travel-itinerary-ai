# ============================================
# AI旅行智能助手 — Nginx 反向代理配置
# ============================================
# 使用方式：
#   将本文件复制到 /etc/nginx/conf.d/ 目录（或 docker-compose 自动挂载）
#   替换 example.com 为你的实际域名
#   配置 SSL 证书路径
# ============================================

upstream travel_assistant {
    # 内网通信，指向 Streamlit 服务
    server travel-assistant:8501 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ========== 限流区（必须位于 http 上下文） ==========
# 每个 IP 每秒最多 10 个请求，突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ========== 访问日志剔除查询串 ==========
# 登录 Token 历史版本通过 URL 传递，避免写入 access.log
log_format app_no_query '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    server_name example.com;
    access_log /var/log/nginx/access.log app_no_query;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 服务 ----
server {
    listen 443 ssl http2;
    server_name example.com;

    # ========== SSL 配置 ==========
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== 安全头 ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ========== 限流 ==========
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/access.log app_no_query;

    # ========== 请求体大小限制 ==========
    # 用户可能上传大文件知识库
    client_max_body_size 100m;
    client_body_buffer_size 128k;

    # ========== 代理超时 ==========
    # LLM 生成可能较慢，读超时需大于应用侧 LLM_TIMEOUT(180s)
    proxy_connect_timeout   60s;
    proxy_read_timeout      300s;
    proxy_send_timeout      120s;

    # ========== 主代理规则 ==========
    location / {
        proxy_pass http://travel_assistant;

        # WebSocket 支持（Streamlit 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       "upgrade";

        # 透传客户端信息
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓存（Streamlit 实时交互）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # ========== 健康检查端点 ==========
    location /health {
        access_log off;
        proxy_pass http://travel_assistant/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ========== 静态资源缓存 ==========
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        proxy_pass http://travel_assistant;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
